services:
  - type: web
    name: neudating
    plan: free
    runtime: rust
    buildCommand: cargo install cargo-leptos --locked && cargo leptos build --release
    startCommand: ./target/release/datingapp
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
