services:
  - type: web
    name: neudating
    env: rust
    buildCommand: |
      rustup target add wasm32-unknown-unknown
      cargo install cargo-leptos --locked
      cargo leptos build --release
    startCommand: ./target/release/datingapp
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true"
