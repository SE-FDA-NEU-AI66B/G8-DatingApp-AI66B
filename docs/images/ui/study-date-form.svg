<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">Create study-date wireframe</title>
  <desc id="desc">Study-date form with date, time, duration, validation and publish action.</desc>
  <rect width="760" height="390" fill="#f4f6f8"/>
  <rect x="24" y="24" width="712" height="462" rx="12" fill="white" stroke="#52606d" stroke-width="2"/>
  <text x="48" y="62" font-family="sans-serif" font-size="22" font-weight="bold">Create a study date</text>
  <text x="48" y="91" font-family="sans-serif" font-size="15">The user comes here to publish a time-limited study session.</text>
  <text x="72" y="136" font-family="sans-serif" font-size="15">Start date and time</text>
  <rect x="72" y="148" width="400" height="40" rx="5" fill="white" stroke="#52606d"/>
  <text x="88" y="174" font-family="sans-serif" font-size="14" fill="#687784">YYYY-MM-DD hh:mm</text>
  <text x="72" y="218" font-family="sans-serif" font-size="15">Duration (hours; maximum 12)</text>
  <rect x="72" y="230" width="180" height="40" rx="5" fill="white" stroke="#52606d"/>
  <text x="88" y="256" font-family="sans-serif" font-size="14">3</text>
  <rect x="72" y="289" width="170" height="40" rx="5" fill="#dce8f5" stroke="#52606d"/>
  <text x="90" y="315" font-family="sans-serif" font-size="14">Publish study date</text>
  <rect x="48" y="343" width="664" height="35" rx="5" fill="#e9eef4" stroke="#8795a1"/>
  <text x="60" y="366" font-family="sans-serif" font-size="13">Home | Register | Feed | Create | Requests | Admin | Sign in (planned)</text>
  <text x="48" y="408" font-family="sans-serif" font-size="12">Loading: submit button reads “Publishing...”</text>
  <text x="48" y="428" font-family="sans-serif" font-size="12">Empty: not applicable to this form</text>
  <text x="48" y="448" font-family="sans-serif" font-size="12">Error: validation or API message</text>
  <text x="48" y="468" font-family="sans-serif" font-size="12">Success: “Study date published.” with feed link</text>
  <text x="48" y="498" font-family="sans-serif" font-size="13" fill="#52606d">API: POST /api/study-dates</text>
</svg>
