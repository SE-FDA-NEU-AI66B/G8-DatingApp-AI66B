<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">Home and navigation wireframe</title>
  <desc id="desc">Home page with links to every P0 screen. The user comes here to choose a task or open a destination.</desc>
  <rect width="760" height="390" fill="#f4f6f8"/>
  <rect x="24" y="24" width="712" height="462" rx="12" fill="white" stroke="#52606d" stroke-width="2"/>
  <text x="48" y="62" font-family="sans-serif" font-size="22" font-weight="bold">NEUDating — Home</text>
  <text x="48" y="91" font-family="sans-serif" font-size="15">The user comes here to choose a task and navigate to a P0 screen.</text>
  <rect x="48" y="116" width="664" height="52" rx="6" fill="#e9eef4" stroke="#52606d"/>
  <text x="64" y="148" font-family="sans-serif" font-size="16">Register | Study dates | Create study date | Match requests | Admin console</text>
  <rect x="48" y="190" width="664" height="142" rx="8" fill="#fff" stroke="#8795a1"/>
  <text x="72" y="225" font-family="sans-serif" font-size="18" font-weight="bold">Welcome</text>
  <text x="72" y="256" font-family="sans-serif" font-size="15">Choose a link above to continue.</text>
  <rect x="48" y="343" width="664" height="35" rx="5" fill="#e9eef4" stroke="#8795a1"/>
  <text x="60" y="366" font-family="sans-serif" font-size="13">Home | Register | Feed | Create | Requests | Admin | Sign in (planned)</text>
  <text x="48" y="408" font-family="sans-serif" font-size="12">Loading: not applicable</text>
  <text x="48" y="428" font-family="sans-serif" font-size="12">Empty: not applicable</text>
  <text x="48" y="448" font-family="sans-serif" font-size="12">Error: not applicable</text>
  <text x="48" y="468" font-family="sans-serif" font-size="12">Success: home content and navigation are rendered</text>
  <text x="48" y="498" font-family="sans-serif" font-size="13" fill="#52606d">API: none on this screen</text>
</svg>
