[env]

[tasks]
cloudflared = "cargo run --example cloudflared"
database = "docker compose --env-file .env -f database/compose.yaml up -d"
database_config = "docker compose --env-file .env -f database/compose.yaml config"
database_clean = "cd database;docker compose down --remove-orphans"
database_note = "uv run marimo edit --watch database/note.py"

[settings]
python.uv_venv_auto = "source"
