services:
  db2:
    image: clickhouse/clickhouse-server
    restart: always
    # --cap-add=SYS_NICE --cap-add=NET_ADMIN --cap-add=IPC_LOCK
    volumes:
      - clickhouse_data:/var/lib/clickhouse/
      - clickhouse_data2:/var/log/clickhouse-server/
    environment:
      - CLICKHOUSE_DB=my_database
      - CLICKHOUSE_USER=username
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=password
    ports:
      - 8123:8123/tcp
      - 9001:9000/tcp
    # docker run -d \
    #   --name some-clickhouse-server --ulimit nofile=262144:262144 clickhouse/clickhouse-server

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - postgres_data:/var/lib/postgresql
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      # POSTGRES_PASSWORD: "{$PGPASS}"
      POSTGRES_PASSWORD: "$PGPASS"
      POSTGRES_DB: userdb
      POSTGRES_USER: "postgres"
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - network
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "postgres@postgres.postgres"
      PGADMIN_DEFAULT_PASSWORD: "itisgnulinux"
    ports:
      - "127.0.0.1:5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - network
  dbgate:
    image: dbgate/dbgate
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    environment:
      # Optional: set basic auth for the web interface
      - BASIC_AUTH=true
      - LOGIN=postgres
      - PASSWORD=itisgnulinux
    depends_on:
      - db
    networks:
      - network

volumes:
  postgres_data:
  pgadmin_data:
  dbgate_data:
  clickhouse_data:
  clickhouse_data2:
networks:
  network:
    driver: bridge
