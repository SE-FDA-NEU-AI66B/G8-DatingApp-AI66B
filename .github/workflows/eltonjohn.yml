name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: quang1234567/cargo-leptos
    steps:
      - uses: actions/checkout@v6
      - run: cargo leptos build --verbose
      - run: cargo leptos build --release --verbose
      - run: cargo test --verbose
