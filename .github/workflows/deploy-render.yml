name: Deploy to Render

on:
  workflow_call:

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tagged commit is on main
        id: main-check
        run: |
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Render deploy hook
        if: steps.main-check.outputs.is_main == 'true'
        env:
          QUANG_RENDER_DEPLOY_HOOK_URL: ${{ secrets.QUANG_RENDER_DEPLOY_HOOK_URL }}
          # RENDER_DEPLOY_HOOK_URL: https://api.render.com/deploy/srv-dbuk8jsipgvc7396dat0?key=NR4E5WKrb8U
        run: |
          test -n "$QUANG_RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$QUANG_RENDER_DEPLOY_HOOK_URL"
